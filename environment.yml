name: srm
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy=1.26.*
  - scipy=1.13.*
  - rasterio=1.3.*
  - geopandas=0.14.*
  - shapely=2.0.*
  - pyyaml=6.0.*
  - pytest=8.2.*
  - ruff=0.5.*
  - pip:
      # For an NVIDIA GPU on Windows, install CUDA builds first:
      #   pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cu124
      - torch==2.4.1
      - torchvision==0.19.1
      - pystac-client==0.8.3
      - planetary-computer==1.0.0
      - lpips==0.1.4
      # Needed only by srm/legacy/segmentation.py and later srm/apps/ (A7):
      - ultralytics>=8.3
